# Artifact-only macOS packaging check for dependency and packaging changes.
# This workflow does not import signing credentials, notarize, draft a release,
# or publish through electron-builder.
name: Validate Unsigned Mac Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: unsigned macOS arm64 app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the docs application
        run: pnpm --filter @botfleet/docs types:check && pnpm --filter @botfleet/docs build
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Build the unsigned app directory
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:recorder
          pnpm build:cua
          pnpm exec electron-builder --mac --arm64 --dir --publish never -c.mac.identity=null
      - name: Verify the packaged launcher and resources
        run: |
          app=release/mac-arm64/BotFleet.app
          res="$app/Contents/Resources"
          launcher="$app/Contents/MacOS/BotFleet"

          node <<'EOF'
          const path = require("node:path");
          const electronBuilderRoot = path.dirname(require.resolve("electron-builder/package.json"));
          const version = require(require.resolve("app-builder-lib/package.json", {
            paths: [electronBuilderRoot],
          })).version;
          const [major, minor] = version.split(".").map(Number);
          if (!Number.isInteger(major) || !Number.isInteger(minor) ||
              major < 26 || (major === 26 && minor < 15)) {
            throw new Error(`app-builder-lib ${version} is below the patched 26.15.0 floor`);
          }
          console.log(`app-builder-lib ${version}`);
          EOF

          test -d "$app" && test ! -L "$app"
          test -f "$launcher" && test ! -L "$launcher" && test -x "$launcher"
          test "$(find "$app/Contents/MacOS" -mindepth 1 -maxdepth 1 -type f -print | wc -l | tr -d ' ')" = 1
          lipo -archs "$launcher" | grep -qw arm64
          file "$launcher"

          for path in \
            "$res/server/index.js" \
            "$res/ui/index.html" \
            "$res/cloudflared/cloudflared" \
            "$res/licenses/cloudflared-LICENSE.txt" \
            "$res/licenses/cloudflared-README.md" \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            test -f "$path" && test ! -L "$path" || {
              echo "::error::missing regular packaged resource $path"; exit 1; }
          done
          for path in \
            "$res/cloudflared/cloudflared" \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            test -x "$path" || { echo "::error::packaged helper is not executable: $path"; exit 1; }
          done

          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs
          node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, path]) => !existsSync(path));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} packaged proxies resolve`);
          EOF

          for path in \
            "$res/cua-driver" \
            "$res/BotFleet Speech.app/Contents/MacOS/speech-helper" \
            "$res/BotFleet Recorder.app/Contents/MacOS/recorder-helper"; do
            lipo -archs "$path" | grep -qw x86_64
            lipo -archs "$path" | grep -qw arm64
          done
          test "$(lipo -archs "$res/cloudflared/cloudflared")" = arm64
          "$res/cloudflared/cloudflared" version | grep -Fq "cloudflared version 2026.8.2 "

          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo "::error::validation artifact unexpectedly carries a Developer ID signature"
            exit 1
          fi
      - name: Archive the unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/BotFleet.app release/BotFleet-unsigned-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botfleet-unsigned-macos-arm64
          path: release/BotFleet-unsigned-arm64.zip
          if-no-files-found: error
          retention-days: 7
