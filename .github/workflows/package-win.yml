# Windows installer, built on a real Windows runner and published as a
# workflow artifact.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: pushing straight to the separate releases
# repo would need a cross-repo token this workflow has no business holding.
name: Package Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - name: Resolve the Sentry DSN
        shell: bash
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set +o xtrace
          set -uo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          # Vite inlines VITE_SENTRY_DSN at build time, so both names must be
          # in the environment before the package step runs.  Never fail the
          # build over a missing DSN -- an inert Sentry beats a red release.
          SENTRY_DSN_VAL=""
          VITE_SENTRY_DSN_VAL=""
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-${INFISICAL_CLIENT_ID:-}}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-${INFISICAL_CLIENT_SECRET:-}}"

          if [ -n "${INFISICAL_PROJECT_ID:-}" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ]; then
            if ! command -v infisical >/dev/null 2>&1; then
              case "${RUNNER_OS:-}" in
                macOS)
                  NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical >/dev/null 2>&1 || true
                  ;;
                Linux)
                  (curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash) >/dev/null 2>&1 \
                    && sudo apt-get install -y infisical >/dev/null 2>&1 || true
                  ;;
                Windows)
                  choco install infisical -y >/dev/null 2>&1 || true
                  ;;
              esac
            fi
            if command -v infisical >/dev/null 2>&1; then
              TOKEN="$(
                env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
                  INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
                  INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
                  infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
              )"
              if [ -n "$TOKEN" ]; then
                echo "::add-mask::$TOKEN"
                SENTRY_DSN_VAL="$(
                  INFISICAL_TOKEN="$TOKEN" infisical secrets get "SENTRY_DSN" \
                    --plain --silent --telemetry=false --expand=false \
                    --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                    2>/dev/null || true
                )"
                VITE_SENTRY_DSN_VAL="$(
                  INFISICAL_TOKEN="$TOKEN" infisical secrets get "VITE_SENTRY_DSN" \
                    --plain --silent --telemetry=false --expand=false \
                    --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                    2>/dev/null || true
                )"
              fi
              unset TOKEN
            fi
          fi
          unset CLIENT_ID CLIENT_SECRET

          if [ -z "$SENTRY_DSN_VAL" ]; then
            SENTRY_DSN_VAL="${GH_FALLBACK_SENTRY_DSN:-}"
          fi
          if [ -z "$VITE_SENTRY_DSN_VAL" ]; then
            VITE_SENTRY_DSN_VAL="$SENTRY_DSN_VAL"
          fi

          if [ -n "$SENTRY_DSN_VAL" ]; then
            echo "::add-mask::$SENTRY_DSN_VAL"
          fi
          if [ -n "$VITE_SENTRY_DSN_VAL" ]; then
            echo "::add-mask::$VITE_SENTRY_DSN_VAL"
          fi

          {
            echo "SENTRY_DSN<<SENTRY_DSN_EOF"
            printf '%s\n' "$SENTRY_DSN_VAL"
            echo "SENTRY_DSN_EOF"
            echo "VITE_SENTRY_DSN<<VITE_SENTRY_DSN_EOF"
            printf '%s\n' "$VITE_SENTRY_DSN_VAL"
            echo "VITE_SENTRY_DSN_EOF"
          } >> "$GITHUB_ENV"

          if [ -z "$SENTRY_DSN_VAL" ] && [ -z "$VITE_SENTRY_DSN_VAL" ]; then
            echo "::warning::SENTRY_DSN is empty after the Infisical prod export and the GitHub secret fallback.  This build packages with Sentry inert."
          fi
      - run: pnpm package:win
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      # Three things silently produce an installer that builds fine and is
      # broken in the field, and none of them can be checked from the Mac the
      # release is cut on — the artifact carries only the .exe. So assert them
      # here, where the unpacked tree exists, and fail the build instead of
      # shipping it.
      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → the 🐭 "Couldn't start the
          # bot server" page
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || {
            echo "::error::missing $res/cloudflared/cloudflared.exe"; fail=1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || {
            echo "::error::missing cloudflared Apache 2.0 license"; fail=1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || {
            echo "::error::missing cloudflared release provenance"; fail=1; }
          if [ -f "$res/cloudflared/cloudflared.exe" ]; then
            expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
            actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::packaged cloudflared hash is $actual"; fail=1; }
            "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::packaged cloudflared has the wrong version"; fail=1; }
          fi
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            grep -q "^repo: BotFleet$" "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at jaywedgeworth22/BotFleet releases"; fail=1; }
            # while the build is unsigned, a publisherName makes
            # electron-updater reject every update as untrusted
            if grep -q "publisherName" "$res/app-update.yml"; then
              echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
            fi
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail

      # index.js EXISTING is not the same as index.js RUNNING. 0.1.24 shipped a
      # server that died instantly on ERR_MODULE_NOT_FOUND because tsc left a
      # bare `zod` import in a tree that carries no node_modules — and the
      # existence check above passed it. Start the real packaged copy here,
      # where node_modules genuinely is not present.
      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/omb-smoke" USERPROFILE="$RUNNER_TEMP/omb-smoke" \
            OMB_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
