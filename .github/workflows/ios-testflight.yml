name: iOS TestFlight Release

# TestFlight ships without git tags.  Push to main (ios/ paths) plus an
# hourly cron, capped at once per hour by scripts/ios-ship-testflight.sh
# (DEFAULT_MIN_INTERVAL_SEC=3600).  Do not push ios-v* tags to ship.
# The Mac wrapper remains the preferred path when this runner is busy.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CURRENT_PROJECT_VERSION override (UTC yyyymmddHHMM).  Blank = the current minute."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"
      - "scripts/ios-ship-testflight.sh"
  schedule:
    - cron: "18 * * * *"

# least privilege: the job reads the checkout and talks to Apple, never to GitHub
permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore iOS ship state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-botfleet-${{ github.run_id }}
          restore-keys: |
            ios-fleet-botfleet-

      - name: Once-per-hour ship gate
        id: gate
        run: |
          mkdir -p "$HOME/.cache/ios-fleet"
          STATE="$HOME/.cache/ios-fleet/last-ship-botfleet.txt"
          now=$(date +%s)
          should=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should=1
          elif [ -f "$STATE" ]; then
            last=$(awk '{print $1}' "$STATE")
            sha=$(awk '{print $2}' "$STATE")
            if [ "$sha" = "${{ github.sha }}" ]; then
              echo "same HEAD as last ship ($sha)"
              should=0
            elif [ -n "$last" ] && [ $((now - last)) -lt 3600 ]; then
              echo "last ship $((now - last))s ago (min 3600s)"
              should=0
            elif [ "${{ github.event_name }}" = "schedule" ] && [ -n "$sha" ]; then
              if git diff --quiet "$sha"..HEAD -- ios/; then
                echo "schedule: no ios/ change since $sha"
                should=0
              fi
            fi
          fi
          echo "should_ship=$should" >> "$GITHUB_OUTPUT"
          echo "should_ship=$should"

      - name: Check that every signing secret is configured
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}.  Add them under Settings > Secrets and variables > Actions, or ship from the Mac with scripts/ios-ship-testflight.sh."
            exit 1
          fi

      - name: Generate the Xcode project
        if: steps.gate.outputs.should_ship == '1'
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Resolve the build number
        if: steps.gate.outputs.should_ship == '1'
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          build="${BUILD_NUMBER_INPUT:-$(date -u +%Y%m%d%H%M)}"
          case "$build" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::build_number must be UTC yyyymmddHHMM (12 digits), got '$build'"; exit 1 ;;
          esac
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$build"

      - name: Import Apple Certificate to Keychain
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install Provisioning Profile
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build and Archive iOS App
        if: steps.gate.outputs.should_ship == '1'
        env:
          # Empty when the secret is absent; SentryTelemetry.start() then no-ops.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd ios
          xcodebuild archive \
            -project BotFleet.xcodeproj \
            -scheme BotFleet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BotFleet.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=build \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export and Upload to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          cd ios
          cat << 'PLIST' > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.botfleet</key>
                  <string>build</string>
              </dict>
          </dict>
          </plist>
          PLIST

          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BotFleet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Record successful ship
        if: success() && steps.gate.outputs.should_ship == '1'
        run: |
          mkdir -p "$HOME/.cache/ios-fleet"
          echo "$(date +%s) ${{ github.sha }}" > "$HOME/.cache/ios-fleet/last-ship-botfleet.txt"
