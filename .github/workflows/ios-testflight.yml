name: iOS TestFlight Release

# Manual fallback only.  The shipping path is `scripts/ios-ship-testflight.sh`
# on the owner's Mac (canonical: /Users/jay/apps/ios-fleet/ship-testflight.sh),
# which owns the build-number sequence, the once-per-hour rate gate, and the
# App Store Connect readiness poll.  This workflow exists for the day that Mac
# is unavailable.  It never runs on a push to main, so a missing or expired
# signing secret cannot paint every merge red.  Trigger it from the Actions tab
# or by pushing an `ios-v*` tag.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CURRENT_PROJECT_VERSION override (UTC yyyymmddHHMM).  Blank = the current minute."
        required: false
        default: ""
  push:
    tags:
      - "ios-v*"

# least privilege: the job reads the checkout and talks to Apple, never to GitHub
permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that every signing secret is configured
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}.  Add them under Settings > Secrets and variables > Actions, or ship from the Mac with scripts/ios-ship-testflight.sh."
            exit 1
          fi

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Resolve the build number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          build="${BUILD_NUMBER_INPUT:-$(date -u +%Y%m%d%H%M)}"
          case "$build" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::build_number must be UTC yyyymmddHHMM (12 digits), got '$build'"; exit 1 ;;
          esac
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$build"

      - name: Import Apple Certificate to Keychain
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build and Archive iOS App
        env:
          # Empty when the secret is absent; SentryTelemetry.start() then no-ops.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd ios
          xcodebuild archive \
            -project BotFleet.xcodeproj \
            -scheme BotFleet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BotFleet.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=build \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export and Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          cd ios
          cat << 'PLIST' > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.botfleet</key>
                  <string>build</string>
              </dict>
          </dict>
          </plist>
          PLIST

          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BotFleet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
