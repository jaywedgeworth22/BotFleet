name: BotFleet
options:
  bundleIdPrefix: app.botfleet
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  xcodeVersion: '26.3'
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
packages:
  CompanionCore:
    path: .
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.44.0
targets:
  BotFleet:
    type: application
    platform: iOS
    sources:
    - path: App
    - path: Shared
    dependencies:
    - target: BotFleetWidgets
      embed: true
    - package: CompanionCore
      product: CompanionCore
    - package: Sentry
      product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.27"
        CURRENT_PROJECT_VERSION: "202609010933"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: app.botfleet.companion.pairing
          CFBundleURLSchemes:
          - botfleet
          - botfleet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: BotFleet finds your computer on this network
          so your bots can reach you here.
        NSCameraUsageDescription: BotFleet uses the camera only to scan a pairing
          QR code shown on your computer.
        NSMicrophoneUsageDescription: BotFleet listens while you dictate a message
          to a bot.
        NSSpeechRecognitionUsageDescription: BotFleet converts your speech into text
          so you can send it to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
        - _botfleet._tcp
        - _botfleet._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            botfleet.app:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: App/BotFleet.entitlements
      properties:
        com.apple.developer.associated-domains:
        - applinks:botfleet.app
        - applinks:agents.jays.services
        - webcredentials:botfleet.app
        com.apple.security.application-groups:
        - group.app.botfleet
        com.apple.developer.usernotifications.time-sensitive: true
  BotFleetWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: Widgets
    - path: Shared
    - path: App/MausAvatar.swift
    - path: App/MausFaceData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.27"
        CURRENT_PROJECT_VERSION: "202609010933"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BotFleetWidgets.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.botfleet
schemes:
  BotFleet:
    build:
      targets:
        BotFleet: all
        BotFleetWidgets: all
    run:
      config: Debug
    archive:
      config: Release
